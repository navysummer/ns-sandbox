name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            pkgs: ""
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            pkgs: musl-tools
          - target: i686-unknown-linux-gnu
            runner: ubuntu-latest
            pkgs: gcc-i686-linux-gnu libc6-dev-i386-cross
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            pkgs: ""
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            pkgs: musl-tools

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation tools
        if: matrix.pkgs != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.pkgs }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configure linker for cross targets
        shell: bash
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              echo "CC_i686_unknown_linux_gnu=i686-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
            x86_64-unknown-linux-musl)
              echo "CC_x86_64_unknown_linux_musl=musl-gcc" >> $GITHUB_ENV
              ;;
            aarch64-unknown-linux-musl)
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
              ;;
          esac

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p release
          BINARY="ns-sandbox"
          ARCHIVE_NAME="ns-sandbox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/$BINARY" "release/"
          cd release
          tar czf "$ARCHIVE_NAME" "$BINARY"
          sha256sum "$BINARY" > "$BINARY.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ns-sandbox-${{ matrix.target }}
          path: release/

  build-macos:
    name: Build macOS (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p release
          BINARY="ns-sandbox"
          ARCHIVE_NAME="ns-sandbox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz"
          cp "target/${{ matrix.target }}/release/$BINARY" "release/"
          cd release
          tar czf "$ARCHIVE_NAME" "$BINARY"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$BINARY" > "$BINARY.sha256"
          else
            shasum -a 256 "$BINARY" > "$BINARY.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ns-sandbox-${{ matrix.target }}
          path: release/

  build-windows:
    name: Build Windows (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p release
          BINARY="ns-sandbox.exe"
          ARCHIVE_NAME="ns-sandbox-${{ github.ref_name }}-${{ matrix.target }}.zip"
          cp "target/${{ matrix.target }}/release/$BINARY" "release/"
          cd release
          7z a "$ARCHIVE_NAME" "$BINARY"
          sha256sum "$BINARY" > "$BINARY.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ns-sandbox-${{ matrix.target }}
          path: release/

  package-linux:
    name: Package Linux
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all Linux binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Install fpm and rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm --no-document

      - name: Create packages
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          PACKAGE_DIR="packages"
          mkdir -p "$PACKAGE_DIR"

          # ── x86_64 packages ──────────────────────────────────

          # DEB amd64 (glibc binary)
          fpm -s dir -t deb \
            -n ns-sandbox -v "$VERSION" \
            --architecture amd64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "utils" \
            binaries/ns-sandbox-x86_64-unknown-linux-gnu/ns-sandbox
          mv *.deb "$PACKAGE_DIR/"

          # RPM x86_64 (glibc binary)
          fpm -s dir -t rpm \
            -n ns-sandbox -v "$VERSION" \
            --architecture x86_64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "Utilities" \
            binaries/ns-sandbox-x86_64-unknown-linux-gnu/ns-sandbox
          mv *.rpm "$PACKAGE_DIR/"

          # APK x86_64 (musl binary for Alpine)
          fpm -s dir -t apk \
            -n ns-sandbox -v "$VERSION" \
            --architecture x86_64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            binaries/ns-sandbox-x86_64-unknown-linux-musl/ns-sandbox
          mv *.apk "$PACKAGE_DIR/"

          # ── aarch64 packages ─────────────────────────────────

          # DEB arm64 (glibc binary)
          fpm -s dir -t deb \
            -n ns-sandbox -v "$VERSION" \
            --architecture arm64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "utils" \
            binaries/ns-sandbox-aarch64-unknown-linux-gnu/ns-sandbox
          mv *.deb "$PACKAGE_DIR/"

          # RPM aarch64 (glibc binary)
          fpm -s dir -t rpm \
            -n ns-sandbox -v "$VERSION" \
            --architecture aarch64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "Utilities" \
            binaries/ns-sandbox-aarch64-unknown-linux-gnu/ns-sandbox
          mv *.rpm "$PACKAGE_DIR/"

          # APK aarch64 (musl binary for Alpine)
          fpm -s dir -t apk \
            -n ns-sandbox -v "$VERSION" \
            --architecture aarch64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            binaries/ns-sandbox-aarch64-unknown-linux-musl/ns-sandbox
          mv *.apk "$PACKAGE_DIR/"

      - name: List packages
        run: ls -lh packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows, package-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate checksums
        run: |
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.apk" \) -exec sha256sum {} \; | tee release-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ns-sandbox ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.sha256
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.apk
            release-checksums.txt
          generate_release_notes: true
