  package-linux:
    name: Package Linux
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all Linux binaries
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Install fpm and rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rpm
          sudo gem install fpm --no-document

      - name: Create packages
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          PACKAGE_DIR="packages"
          mkdir -p "$PACKAGE_DIR"

          # ── x86_64 packages ──────────────────────────────────

          # DEB amd64 (glibc binary)
          fpm -s dir -t deb \
            -n ns-sandbox -v "$VERSION" \
            --architecture amd64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "utils" \
            binaries/ns-sandbox-x86_64-unknown-linux-gnu/ns-sandbox
          mv *.deb "$PACKAGE_DIR/"

          # RPM x86_64 (glibc binary)
          fpm -s dir -t rpm \
            -n ns-sandbox -v "$VERSION" \
            --architecture x86_64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "Utilities" \
            binaries/ns-sandbox-x86_64-unknown-linux-gnu/ns-sandbox
          mv *.rpm "$PACKAGE_DIR/"

          # APK x86_64 (musl binary for Alpine)
          fpm -s dir -t apk \
            -n ns-sandbox -v "$VERSION" \
            --architecture x86_64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            binaries/ns-sandbox-x86_64-unknown-linux-musl/ns-sandbox
          mv *.apk "$PACKAGE_DIR/"

          # ── aarch64 packages ─────────────────────────────────

          # DEB arm64 (glibc binary)
          fpm -s dir -t deb \
            -n ns-sandbox -v "$VERSION" \
            --architecture arm64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "utils" \
            binaries/ns-sandbox-aarch64-unknown-linux-gnu/ns-sandbox
          mv *.deb "$PACKAGE_DIR/"

          # RPM aarch64 (glibc binary)
          fpm -s dir -t rpm \
            -n ns-sandbox -v "$VERSION" \
            --architecture aarch64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            --category "Utilities" \
            binaries/ns-sandbox-aarch64-unknown-linux-gnu/ns-sandbox
          mv *.rpm "$PACKAGE_DIR/"

          # APK aarch64 (musl binary for Alpine)
          fpm -s dir -t apk \
            -n ns-sandbox -v "$VERSION" \
            --architecture aarch64 \
            --prefix /usr/local/bin \
            --description "Cross-platform command-line sandbox for Linux, macOS, and Windows" \
            --license MIT \
            --url "https://github.com/navysummer/ns-sandbox" \
            --maintainer "navysummer@yeah.net" \
            --vendor "navysummer" \
            binaries/ns-sandbox-aarch64-unknown-linux-musl/ns-sandbox
          mv *.apk "$PACKAGE_DIR/"

      - name: List packages
        run: ls -lh packages/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packages/

  homebrew-core:
    name: Update Homebrew Formula
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ns-sandbox
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout homebrew-core
        uses: actions/checkout@v4
        with:
          repository: navysummer/homebrew-core
          token: ${{ secrets.GH_TOKEN }}
          path: homebrew-core

      - name: Update Homebrew Formula
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          FORMULA_PATH="homebrew-core/Formula/n/ns-sandbox.rb"
          
          # Get download URLs for each platform
          LINUX_GLIBC_X86_64_URL="https://github.com/navysummer/ns-sandbox/releases/download/v${VERSION}/ns-sandbox-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          LINUX_GLIBC_ARM64_URL="https://github.com/navysummer/ns-sandbox/releases/download/v${VERSION}/ns-sandbox-v${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
          LINUX_MUSL_X86_64_URL="https://github.com/navysummer/ns-sandbox/releases/download/v${VERSION}/ns-sandbox-v${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          LINUX_MUSL_ARM64_URL="https://github.com/navysummer/ns-sandbox/releases/download/v${VERSION}/ns-sandbox-v${VERSION}-aarch64-unknown-linux-musl.tar.gz"
          
          # Create curl command to test URLs
          #!/bin/bash
          curl -sfL "${LINUX_GLIBC_X86_64_URL}" > /dev/null && echo "URL exists: ${LINUX_GLIBC_X86_64_URL}" || echo "URL error: ${LINUX_GLIBC_X86_64_URL}"
          curl -sfL "${LINUX_GLIBC_ARM64_URL}" > /dev/null && echo "URL exists: ${LINUX_GLIBC_ARM64_URL}" || echo "URL error: ${LINUX_GLIBC_ARM64_URL}"
          curl -sfL "${LINUX_MUSL_X86_64_URL}" > /dev/null && echo "URL exists: ${LINUX_MUSL_X86_64_URL}" || echo "URL error: ${LINUX_MUSL_X86_64_URL}"
          curl -sfL "${LINUX_MUSL_ARM64_URL}" > /dev/null && echo "URL exists: ${LINUX_MUSL_ARM64_URL}" || echo "URL error: ${LINUX_MUSL_ARM64_URL}"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN }}
          path: homebrew-core
          base: main
          branch: homebrew/update-ns-sandbox-${{ github.ref_name }}
          title: "Update ns-sandbox to version ${{ steps.version.outputs.version }}"
          body: |
            This PR updates ns-sandbox to version ${{ steps.version.outputs.version }}
            
            ## Changes
            - Update formula version
            - Add download URLs for Linux glibc/x86_64, glibc/arm64, musl/x86_64, musl/arm64
            - Update checksums if needed
            
            ## Testing
            Please verify that the formula builds correctly and the binaries download successfully.
          labels: |
            homebrew update
            dependencies
          assignees: navysummer

  release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows, package-linux, homebrew-core]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Generate checksums
        run: |
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.deb" -o -name "*.rpm" -o -name "*.apk" \) -exec sha256sum {} \; | tee release-checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ns-sandbox ${{ github.ref_name }}
          fail_on_unmatched_files: false
          files: |
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.zip
            release-artifacts/**/*.sha256
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.apk
            release-checksums.txt
          generate_release_notes: true